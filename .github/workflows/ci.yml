# CI for ephraimduncan/duncan.land
# pnpm@10.32.1 (packageManager); scripts: typecheck (tsgo --noEmit), build (vp build)
# Notes:
# - `pnpm build` runs content-collections codegen itself, so no separate
#   codegen step is needed.
# - typecheck currently reports 8 pre-existing repo errors on main
#   (missing @types/mdx dep, narrowing issues in api routes), so it runs
#   advisory until those are fixed upstream.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (advisory)
        run: pnpm typecheck
        continue-on-error: true
      - name: Build
        run: pnpm build
